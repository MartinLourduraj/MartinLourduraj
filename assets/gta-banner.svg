<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      @keyframes heliMove {
        0% { transform: translate(-30px, 0px); }
        50% { transform: translate(320px, -15px); }
        100% { transform: translate(-30px, 0px); }
      }
      @keyframes rotorSpin {
        0% { transform: scaleX(1); }
        50% { transform: scaleX(0.08); }
        100% { transform: scaleX(1); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes neonPulse {
        0%, 100% { filter: drop-shadow(0 0 15px rgba(32, 232, 139, 0.8)); }
        50% { filter: drop-shadow(0 0 28px rgba(0, 216, 199, 1)); }
      }
      @keyframes roadGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.85; }
      }
      .heli { animation: heliMove 24s ease-in-out infinite; }
      .rotor { animation: rotorSpin 0.08s linear infinite; transform-origin: 30px 6px; }
      .beacon { animation: beaconBlink 1.2s infinite; }
      .neon-title { animation: neonPulse 3s ease-in-out infinite; }
      .road-reflect { animation: roadGlow 4s ease-in-out infinite alternate; }
    </style>

    <!-- Sky Gradient: Sunset to Night -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040D17" />
      <stop offset="35%" stop-color="#071929" />
      <stop offset="65%" stop-color="#143644" />
      <stop offset="82%" stop-color="#3D261A" />
      <stop offset="92%" stop-color="#B85520" />
      <stop offset="98%" stop-color="#FFA843" />
      <stop offset="100%" stop-color="#0B1A24" />
    </linearGradient>

    <!-- Wet Asphalt Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1822" />
      <stop offset="40%" stop-color="#061017" />
      <stop offset="100%" stop-color="#02070A" />
    </linearGradient>

    <!-- Brush Pill Gradient for CSVS IT TECH -->
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#135E56" />
      <stop offset="100%" stop-color="#20E88B" />
    </linearGradient>

    <!-- Taillight Glow -->
    <radialGradient id="tailGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A2A" />
      <stop offset="100%" stop-color="#FF2A2A" stop-opacity="0" />
    </radialGradient>

    <!-- Headlight Beam -->
    <radialGradient id="headBeam" cx="100%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#00D8C7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#20E88B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06131F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- === BACKGROUND: SKY & SUNSET === -->
  <rect width="1200" height="420" fill="url(#skyGrad)" />

  <!-- Atmospheric Glow -->
  <ellipse cx="600" cy="310" rx="500" ry="120" fill="#FFA843" fill-opacity="0.25" />

  <!-- Moving Helicopter -->
  <g class="heli" transform="translate(180, 45)">
    <line x1="10" y1="6" x2="50" y2="6" stroke="#94A3B8" stroke-width="1.5" class="rotor" />
    <line x1="30" y1="6" x2="30" y2="12" stroke="#475569" stroke-width="2" />
    <path d="M 18 16 C 18 12, 42 12, 45 16 C 47 20, 42 24, 24 24 C 18 24, 18 20, 18 16 Z" fill="#0A1118" stroke="#1E293B" stroke-width="1" />
    <path d="M 36 14 L 44 16 L 40 20 L 34 19 Z" fill="#38BDF8" fill-opacity="0.75" />
    <line x1="18" y1="18" x2="2" y2="15" stroke="#0F172A" stroke-width="2.5" />
    <line x1="2" y1="10" x2="2" y2="20" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="30" cy="12" r="2.5" fill="#EF4444" class="beacon" />
  </g>

  <!-- Distant Hollywood/Los Santos Sign on Hill -->
  <text x="1050" y="80" fill="#FFE0B2" fill-opacity="0.35" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" letter-spacing="4">LOS SANTOS</text>

  <!-- === CITY SKYLINE SKYSCRAPERS === -->
  <g fill="#07131D" fill-opacity="0.85">
    <rect x="50" y="140" width="45" height="180" />
    <rect x="110" y="110" width="55" height="210" />
    <polygon points="137,70 135,110 139,110" stroke="#EF4444" stroke-width="1.5" class="beacon" />
    <rect x="180" y="150" width="40" height="170" />
    <rect x="235" y="120" width="70" height="200" />
    <rect x="320" y="80" width="55" height="240" />
    <polygon points="347,40 345,80 349,80" stroke="#EF4444" stroke-width="1.5" class="beacon" />
    <rect x="390" y="130" width="60" height="190" />
    <rect x="465" y="90" width="50" height="230" />
    <rect x="530" y="70" width="60" height="250" />
    <polygon points="560,30 558,70 562,70" stroke="#EF4444" stroke-width="1.5" class="beacon" />
    <rect x="605" y="110" width="75" height="210" />
    <rect x="695" y="95" width="55" height="225" />
    <rect x="765" y="135" width="65" height="185" />
    <rect x="845" y="85" width="60" height="235" />
    <polygon points="875,45 873,85 877,85" stroke="#EF4444" stroke-width="1.5" class="beacon" />
    <rect x="920" y="125" width="55" height="195" />
    <rect x="990" y="105" width="70" height="215" />
    <rect x="1075" y="145" width="85" height="175" />
  </g>

  <!-- Illuminated Windows (Amber & Cyan) -->
  <g fill="#FFD166" fill-opacity="0.8">
    <circle cx="125" cy="130" r="1.5" /><circle cx="145" cy="130" r="1.5" />
    <circle cx="125" cy="150" r="1.5" /><circle cx="135" cy="165" r="1.5" />
    <circle cx="335" cy="100" r="1.5" /><circle cx="355" cy="100" r="1.5" />
    <circle cx="335" cy="120" r="1.5" /><circle cx="355" cy="140" r="1.5" />
    <circle cx="545" cy="90" r="1.5" /><circle cx="560" cy="90" r="1.5" /><circle cx="575" cy="90" r="1.5" />
    <circle cx="545" cy="110" r="1.5" /><circle cx="575" cy="110" r="1.5" />
    <circle cx="545" cy="130" r="1.5" /><circle cx="560" cy="130" r="1.5" />
    <circle cx="860" cy="110" r="1.5" /><circle cx="880" cy="110" r="1.5" />
    <circle cx="860" cy="130" r="1.5" /><circle cx="880" cy="150" r="1.5" />
  </g>
  <g fill="#00D8C7" fill-opacity="0.8">
    <circle cx="250" cy="140" r="1.5" /><circle cx="270" cy="140" r="1.5" />
    <circle cx="480" cy="115" r="1.5" /><circle cx="495" cy="115" r="1.5" />
    <circle cx="625" cy="130" r="1.5" /><circle cx="650" cy="130" r="1.5" />
    <circle cx="715" cy="120" r="1.5" /><circle cx="730" cy="140" r="1.5" />
    <circle cx="1010" cy="125" r="1.5" /><circle cx="1035" cy="145" r="1.5" />
  </g>

  <!-- Palm Trees -->
  <path d="M 30 360 Q 35 270 30 205" stroke="#04090E" stroke-width="5" fill="none" />
  <path d="M 30 205 Q 10 180 -15 195 M 30 205 Q 20 170 8 175 M 30 205 Q 45 175 65 190 M 30 205 Q 60 200 68 220" stroke="#04090E" stroke-width="3" fill="none" />
  <path d="M 1170 360 Q 1165 270 1175 200" stroke="#04090E" stroke-width="5" fill="none" />
  <path d="M 1175 200 Q 1150 175 1130 185 M 1175 200 Q 1170 165 1158 170 M 1175 200 Q 1195 170 1215 180" stroke="#04090E" stroke-width="3.5" fill="none" />

  <!-- === WET ROAD & REFLECTIONS === -->
  <rect x="0" y="315" width="1200" height="105" fill="url(#roadGrad)" />
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#20E88B" stroke-opacity="0.35" stroke-width="2" />
  <line x1="0" y1="318" x2="1200" y2="318" stroke="#00D8C7" stroke-opacity="0.2" stroke-width="1" />

  <!-- Road Neon Reflection Streaks -->
  <ellipse cx="610" cy="350" rx="350" ry="25" fill="#20E88B" fill-opacity="0.12" class="road-reflect" />
  <ellipse cx="980" cy="365" rx="180" ry="20" fill="#FF2A2A" fill-opacity="0.22" class="road-reflect" />
  <ellipse cx="440" cy="355" rx="140" ry="18" fill="#00D8C7" fill-opacity="0.18" class="road-reflect" />

  <!-- Dashed Road Dividers -->
  <g stroke="#FFD166" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="35,45">
    <line x1="0" y1="375" x2="1200" y2="375" />
  </g>

  <!-- === FOREGROUND: MAIN HERO TYPOGRAPHY === -->
  <g transform="translate(60, 110)">
    <!-- MARTIN LOURDURAJ -->
    <text 
      x="0" 
      y="45" 
      fill="#FFFFFF" 
      font-family="'Impact', 'Arial Black', sans-serif" 
      font-size="56" 
      font-weight="900" 
      letter-spacing="3" 
      transform="skewX(-7)"
      class="neon-title"
    >
      MARTIN LOURDURAJ
    </text>

    <!-- CSVS IT TECH BADGE -->
    <g transform="translate(4, 62)">
      <polygon points="0,0 240,0 228,34 0,34" fill="url(#brushGrad)" />
      <text 
        x="115" 
        y="24" 
        fill="#040C14" 
        font-family="'Impact', 'Arial Black', sans-serif" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="2" 
        text-anchor="middle"
        transform="skewX(-7)"
      >
        CSVS IT TECH
      </text>
    </g>

    <!-- TAGLINE -->
    <text 
      x="4" 
      y="125" 
      fill="#20E88B" 
      font-family="'Arial', 'Helvetica', sans-serif" 
      font-size="13" 
      font-weight="700" 
      letter-spacing="4"
    >
      HEALTHCARE • SOFTWARE • CLOUD • AUTOMATION
    </text>
  </g>

  <!-- === FOREGROUND VEHICLES === -->
  <!-- CENTER-LEFT: Sports Motorcycle Silhouette & Headlight -->
  <g transform="translate(490, 245)">
    <!-- Headlight Beam -->
    <polygon points="15,65 -90,50 -90,95" fill="url(#headBeam)" />
    <!-- Rider & Bike Body -->
    <ellipse cx="60" cy="115" rx="55" ry="6" fill="#020508" fill-opacity="0.8" />
    <circle cx="30" cy="95" r="18" fill="#091219" stroke="#20E88B" stroke-width="1.5" />
    <circle cx="95" cy="95" r="18" fill="#091219" stroke="#20E88B" stroke-width="1.5" />
    <path d="M 25 70 L 65 58 L 105 65 L 75 88 Z" fill="#20E88B" />
    <circle cx="28" cy="70" r="4" fill="#00D8C7" />
    <!-- Rider -->
    <circle cx="62" cy="38" r="8" fill="#0B131D" stroke="#20E88B" stroke-width="1" />
    <path d="M 60 45 L 82 62 L 68 78 L 48 68 Z" fill="#0B131D" />
  </g>

  <!-- RIGHT: Silver & Black Supercar -->
  <g transform="translate(760, 220)">
    <!-- Reflection -->
    <ellipse cx="180" cy="140" rx="160" ry="10" fill="#FF2A2A" fill-opacity="0.3" />
    <!-- Rear Wing -->
    <polygon points="120,45 220,40 250,48 150,52" fill="#0B131D" />
    <polygon points="245,35 258,42 254,55 240,50" fill="#20E88B" />
    <!-- Car Body -->
    <path d="M 30 95 C 70 90, 110 55, 170 45 C 220 38, 280 50, 310 80 C 322 92, 318 115, 275 115 L 245 115 C 235 98, 195 98, 180 115 L 90 115 C 80 98, 40 98, 30 115 Z" fill="#8A9BA8" stroke="#00D8C7" stroke-width="0.8" />
    <!-- Roof / Window -->
    <path d="M 125 50 C 160 42, 210 40, 245 52 L 230 78 L 120 78 Z" fill="#06131F" />
    <!-- Red Taillight Cluster -->
    <polygon points="255,80 295,80 305,90 265,90" fill="#FF2A2A" />
    <circle cx="280" cy="85" r="16" fill="url(#tailGlow)" />
    <!-- License Plate: CSVS IT -->
    <rect x="268" y="93" width="28" height="10" rx="1.5" fill="#06121C" stroke="#20E88B" stroke-width="0.8" />
    <text x="282" y="100.5" fill="#20E88B" font-family="'Arial', sans-serif" font-size="5" font-weight="900" text-anchor="middle">CSVS IT</text>
    <!-- Exhausts -->
    <circle cx="260" cy="102" r="3.5" fill="#1E2A38" stroke="#8A9BA8" stroke-width="0.8" />
    <circle cx="300" cy="102" r="3.5" fill="#1E2A38" stroke="#8A9BA8" stroke-width="0.8" />
    <!-- Wheels -->
    <circle cx="60" cy="115" r="18" fill="#080C10" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="210" cy="115" r="21" fill="#080C10" stroke="#CBD5E1" stroke-width="1.5" />
  </g>
</svg>
