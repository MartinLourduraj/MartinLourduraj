      <stop offset="0%" stop-color="#351B42" />
      <stop offset="100%" stop-color="#23142E" />
    </linearGradient>
    <linearGradient id="lineGrad_vice-city" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF79BA" />
      <stop offset="30%" stop-color="#FF65B5" />
      <stop offset="70%" stop-color="#34E1E6" />
      <stop offset="100%" stop-color="#FF79BA" />
    </linearGradient>
  </defs>

  <rect width="1200" height="120" fill="url(#footerBg_vice-city)" rx="8" />
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#lineGrad_vice-city)" stroke-width="3" />

  <!-- Skyline Silhouette in Footer -->
  <g fill="#23142E" opacity="0.7">
